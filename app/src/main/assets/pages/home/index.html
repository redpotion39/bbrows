<!DOCTYPE html>
<html>
<head>
    <title>Bbrows: Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
:root {
    --bg-page: #F7F4EE;
    --surface: #FDFBF7;
    --raised: #EFE9DF;
    --line: rgba(31, 27, 22, 0.09);
    --line-strong: rgba(31, 27, 22, 0.18);
    --ink: #1F1B16;
    --ink-secondary: #5E554A;
    --ink-muted: #7B7266;
    --accent: #D97706;
    --focus-ring: #D97706;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.06);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg-page: #161513;
        --surface: #1C1A18;
        --raised: #262421;
        --line: rgba(239, 233, 222, 0.08);
        --line-strong: rgba(239, 233, 222, 0.16);
        --ink: #EFE9DE;
        --ink-secondary: #AAA398;
        --ink-muted: #8A847A;
        --accent: #F59E0B;
        --focus-ring: #F59E0B;
        --shadow: none;
        --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    color: var(--ink);
    background-color: var(--bg-page);
    font-family: Roboto, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
}

#suggestions {
    width: 68vw;
    max-width: 1120px;
    margin: auto;
    table-layout: fixed;
    outline: none;
    position: relative;
    top: 15vh;
    -webkit-border-horizontal-spacing: 16px;
    -webkit-border-vertical-spacing: 16px !important;
    border-spacing: 16px;
}

td {
    overflow: hidden;
    white-space: nowrap;
    word-wrap: break-word;
    outline: none;
}

.sugg {
    padding: 16px;
    white-space: nowrap;
    word-wrap: break-word;
    color: var(--ink);
    background: var(--surface);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease);
}

.sugg:hover,
td:focus .sugg,
td:focus-within .sugg {
    background: var(--raised);
    border-color: var(--focus-ring);
}

.sugg:active {
    transform: scale(0.98);
}

.sugg.add-tile {
    border: 1px dashed var(--line-strong);
    background: transparent;
}

.sugg.add-tile:hover {
    border-style: solid;
    border-color: var(--focus-ring);
    background: var(--raised);
}

.sugg-ico {
    width: 36px;
    height: 36px;
    float: left;
    border-radius: 8px;
    object-fit: contain;
    color-scheme: only light;
}

.sugg-title {
    display: block;
    max-width: 88%;
    margin-left: 48px;
    font-weight: 500;
    font-size: 16px;
    line-height: 22px;
    color: var(--ink);
    background-color: transparent;
}

.sugg-title.empty {
    background-color: var(--raised);
    border-radius: 6px;
}

.ellipsize, .sugg-title, .sugg-desk {
    text-overflow: ellipsis;
    overflow: hidden;
}

.sugg-desk {
    display: block;
    color: var(--ink-muted);
    margin-left: 48px;
    font-weight: 400;
    font-size: 13px;
    line-height: 18px;
    background-color: transparent;
}

.sugg-desk.empty {
    background-color: var(--raised);
    border-radius: 6px;
    margin-top: 4px;
}

.more {
    width: 16px;
    height: 16px;
    float: right;
    margin-top: 2px;
    opacity: 0.65;
    cursor: pointer;
    display: none;
    transition: opacity 150ms var(--ease);
}

.more:hover {
    opacity: 1;
}

.logo {
    width: 148px;
    height: 52px;
    top: 6vh;
    left: 16vw;
    background-image: url("logo.png");
    background-repeat: no-repeat;
    background-position: left center;
    background-size: contain;
    position: absolute;
}

.wrapper {
    position: relative;
    top: 13vh;
    width: 68vw;
    max-width: 1088px;
    margin: auto;
}

.search_box {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    height: 56px;
    display: flex;
    align-items: center;
    padding: 6px;
    box-shadow: var(--shadow);
    transition: border-color 150ms var(--ease), background-color 150ms var(--ease);
}

.search_box:focus-within {
    border-color: var(--focus-ring);
}

.wrapper .search_box .dropdown {
    width: 68px;
    height: 40px;
    border-right: 1px solid var(--line);
    color: var(--ink-secondary);
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
}

.wrapper .search_box .dropdown .default_option {
    display: block;
    background: url(favicons/google.png) no-repeat center;
    width: 28px;
    height: 28px;
    margin-left: 12px;
    background-size: 28px;
    border-radius: 6px;
}

.wrapper .search_box .dropdown ul {
    z-index: 10;
    position: absolute;
    top: 48px;
    left: 0;
    margin: 0;
    font-size: 15px;
    list-style-type: none;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    width: 200px;
    border-radius: 12px;
    padding: 8px;
    display: none;
    box-shadow: var(--shadow-float);
}

.wrapper .search_box .dropdown ul.active {
    display: block;
}

.wrapper .search_box .dropdown ul li {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 8px;
    color: var(--ink);
    transition: background-color 150ms var(--ease);
}

.wrapper .search_box .dropdown ul li img {
    width: 20px;
    height: 20px;
    display: block;
    margin-right: 10px;
    border-radius: 4px;
    color-scheme: only light;
}

.wrapper .search_box .dropdown ul li:hover {
    background: var(--raised);
}

.wrapper .search_box .dropdown:before {
    content: "";
    position: absolute;
    top: 17px;
    right: 12px;
    border: 5px solid;
    border-color: var(--ink-muted) transparent transparent transparent;
}

.wrapper .search_box .search_field {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
}

.wrapper .search_box .search_field .input {
    width: 100%;
    height: 100%;
    border: 0;
    outline: none;
    font-family: inherit;
    font-size: 17px;
    padding-left: 16px;
    padding-right: 16px;
    color: var(--ink);
    background-color: transparent;
    flex-grow: 1;
}

.wrapper .search_box .search_action_container {
    border-left: 1px solid var(--line);
    width: 52px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0 8px 8px 0;
}

.wrapper .search_box .search_action_container .mic {
    width: 22px;
    height: 22px;
    background-image: url(mic.svg);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

.wrapper .search_box .search_action_container .lenz {
    width: 22px;
    height: 22px;
    background-image: url(search.svg);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    display: none;
}

::-webkit-input-placeholder {
    color: var(--ink-muted);
}
::-moz-placeholder {
    color: var(--ink-muted);
}

/*
Phones (narrow, or short in landscape): sizes in CSS pixels (dp) instead of parts of the screen,
the logo and the search bar in the flow, the speed dial in two columns of 56px tiles.
*/
@media (max-width: 600px), (max-height: 420px) {
    #suggestions {
        width: calc(100% - 8px);
        max-width: 600px;
        top: 0;
        margin: 8px auto 16px;
        -webkit-border-horizontal-spacing: 12px;
        -webkit-border-vertical-spacing: 12px !important;
        border-spacing: 12px;
    }
    .sugg {
        box-sizing: border-box;
        height: 56px;
        padding: 8px 12px;
        border-radius: 10px;
    }
    .sugg-ico {
        width: 32px;
        height: 32px;
        margin-top: 4px;
        border-radius: 6px;
    }
    .sugg-title {
        margin-left: 44px;
        font-size: 14px;
        line-height: 20px;
    }
    .sugg-desk {
        margin-left: 44px;
        font-size: 12px;
        line-height: 16px;
    }
    .more {
        width: 16px;
        padding: 10px 8px;
        margin: -8px -10px 0 0;
    }
    .logo {
        position: relative;
        top: 0;
        left: 0;
        width: 132px;
        height: 48px;
        margin: 24px auto 0;
        background-position: center;
    }
    .wrapper {
        top: 0;
        width: calc(100% - 32px);
        max-width: 576px;
        margin: 16px auto 0;
    }
    .search_box {
        height: 48px;
        padding: 4px;
        border-radius: 10px;
    }
    .wrapper .search_box .dropdown {
        width: 56px;
        height: 36px;
    }
    .wrapper .search_box .dropdown .default_option {
        width: 24px;
        height: 24px;
        margin-left: 10px;
        background-size: 24px;
    }
    .wrapper .search_box .dropdown:before {
        top: 15px;
        right: 8px;
        border-width: 4px;
    }
    .wrapper .search_box .search_field .input {
        font-size: 16px;
        padding-left: 12px;
        padding-right: 8px;
    }
    .wrapper .search_box .search_action_container {
        width: 44px;
        height: 36px;
    }
}

/*
Tablets (touch screens wider than phones; TVs have no coarse pointer): a bigger touch target for the menu
of a tile, its padding taken back by margins so the tile keeps its layout.
*/
@media (any-pointer: coarse) and (min-width: 601px) and (min-height: 421px) {
    .more {
        padding: 12px 16px;
        margin: -10px -12px -12px -16px;
    }
}
    </style>
</head>
<body>
