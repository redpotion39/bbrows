<!DOCTYPE html>
<!--
The page of the TV in the local network (LocalSendServer): another device of the network sends texts and files
to the TV from it. The TV fills the {{holes}} with its strings (ErrorPageTemplate); the key of the TV is in the
fragment of the link (#k=…) and goes with each request.
-->
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<style>
:root {
    --bg-page: #F7F4EE;
    --surface: #FDFBF7;
    --control: #EFE9DF;
    --line: rgba(31, 27, 22, 0.12);
    --focus: #D97706;
    --ink: #1F1B16;
    --ink-faint: #7B7266;
    --accent: #D97706;
    --on-accent: #12110F;
    --danger: #DC2626;
    --ok: #16A34A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg-page: #161513;
        --surface: #1C1A18;
        --control: #262421;
        --line: rgba(239, 233, 222, 0.10);
        --focus: #F59E0B;
        --ink: #EFE9DE;
        --ink-faint: #8A847A;
        --accent: #F59E0B;
        --on-accent: #12110F;
        --danger: #E5484D;
        --ok: #4CC38A;
        --shadow: none;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg-page);
    color: var(--ink);
    font: 15px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
main {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
}
h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; }
h2 { margin: 24px 0 8px; font-size: 16px; line-height: 22px; font-weight: 500; }
.tv { margin: 4px 0 0; font-size: 13px; color: var(--ink-faint); }
.row { display: flex; gap: 8px; }
input[type="text"] {
    flex: 1;
    min-width: 0;
    height: 44px;
    padding: 8px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--control);
    border: 1px solid var(--line);
    border-radius: 8px;
}
input[type="text"]:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
button, .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 16px;
    font: inherit;
    font-weight: 500;
    color: var(--on-accent);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 150ms cubic-bezier(0.22, 1, 0.36, 1), transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
}
button:active, .button:active { transform: scale(0.98); }
button:disabled { opacity: .5; cursor: default; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--ink-faint); }
.status { margin: 8px 0 0; font-size: 13px; min-height: 20px; }
.status.ok { color: var(--ok); }
.status.error { color: var(--danger); }
progress { width: 100%; margin-top: 8px; }
.touchpad {
    height: 176px;
    background: var(--control);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13px;
    user-select: none;
    touch-action: none;
}
.remote-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn-secondary {
    background: var(--control);
    color: var(--ink);
    border: 1px solid var(--line);
}
.dpad-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
}
.dpad-row {
    display: flex;
    gap: 8px;
}
.dpad-btn {
    width: 64px;
    height: 48px;
    background: var(--control);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}
.dpad-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.dpad-btn:active {
    background: var(--accent);
    color: var(--on-accent);
}
.dpad-btn.dpad-center {
    width: 72px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 14px;
    font-weight: 500;
}
</style>
</head>
<body
    data-sent="{{sent}}"
    data-sending="{{sending}}"
    data-saved="{{saved}}"
    data-need-permission="{{need_permission}}"
    data-storage="{{storage}}"
    data-cancelled="{{cancelled}}"
    data-failed="{{failed}}"
    data-bad-key="{{bad_key}}"
    data-offline="{{offline}}">
<main>
  <h1>{{title}}</h1>
  <p class="tv">{{tv}}</p>

  <form id="textForm">
    <h2>{{open_title}}</h2>
    <div class="row">
      <input type="text" id="text" name="text" autocomplete="off" autocapitalize="off" enterkeyhint="send"
          maxlength="2048" placeholder="{{address_hint}}" required>
      <button type="submit" id="send">{{send}}</button>
    </div>
    <p class="status" id="textStatus" role="status"></p>
  </form>

  <section>
    <h2>{{files_title}}</h2>
    <label class="button" for="files">{{choose_files}}</label>
    <input type="file" id="files" multiple hidden>
    <p class="hint">{{files_hint}}</p>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p class="status" id="fileStatus" role="status"></p>
  </section>

  <section>
    <h2>{{remote_title}}</h2>
    <div class="touchpad" id="touchpad">{{remote_hint}}</div>
    <div class="remote-actions">
      <button type="button" class="btn-secondary" id="remoteBack">{{remote_back}}</button>
      <input type="text" id="remoteInput" autocomplete="off" placeholder="{{remote_type_hint}}">
      <button type="button" id="remoteTypeBtn">{{send}}</button>
    </div>
    <div class="dpad-container">
      <div class="dpad-row">
        <button type="button" class="dpad-btn" id="dpadUp" aria-label="Up">
          <svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
        </button>
      </div>
      <div class="dpad-row">
        <button type="button" class="dpad-btn" id="dpadLeft" aria-label="Left">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="dpad-btn dpad-center" id="dpadOk" aria-label="OK">OK</button>
        <button type="button" class="dpad-btn" id="dpadRight" aria-label="Right">
          <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="dpad-row">
        <button type="button" class="dpad-btn" id="dpadDown" aria-label="Down">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>
<script src="send.js"></script>
</body>
</html>
